name: Refresh Retail Prices

on:
  # Automatic collection paused until a provider and its execution policy are approved.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: retail-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.34.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx server/scripts/refreshRetailPrices.ts
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
          RETAIL_BATCH_LIMIT: "100"
          # Repository variables opt in; they do not replace the reviewed policy.
          RETAIL_11ST_ENABLED: ${{ vars.RETAIL_11ST_ENABLED || 'false' }}
          RETAIL_COUPANG_ENABLED: ${{ vars.RETAIL_COUPANG_ENABLED || 'false' }}
          RETAIL_GMARKET_ENABLED: ${{ vars.RETAIL_GMARKET_ENABLED || 'false' }}
          RETAIL_AUCTION_ENABLED: ${{ vars.RETAIL_AUCTION_ENABLED || 'false' }}
          RETAIL_NAVER_ENABLED: ${{ vars.RETAIL_NAVER_ENABLED || 'false' }}
